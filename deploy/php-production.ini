; Apply in the hosting PHP configuration; verify the web SAPI separately from CLI.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
upload_max_filesize = 8M
post_max_size = 10M
; Configure error_log to an access-controlled path outside public/ on the host.
